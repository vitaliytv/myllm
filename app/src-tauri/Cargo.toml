[package]
name = "myllm"
version = "0.1.0"
description = "omlx LLM-chains viewer + pi-agent chat/analysis (проксі винесено в myllm-proxy-service)"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "myllm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Shared agent journal + omlx config commands (plugin:agent|*) — same crate the
# task/mlmail/myshare apps use, so the journal/omlx backend isn't copied per app.
tauri-plugin-agent = { git = "https://github.com/nitra/tauri-components", rev = "12371a0546faeeb6eec71bd7f9a06bc9eb6f0178" }
# @7n/tauri-components' useAgent() робить свій chat-виклик до omlx через
# tauriFetch (JS) — єдина причина цього плагіна лишається чинною й після
# винесення проксі (той код ходив напряму через reqwest, а не через нього).
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tauri-plugin-mcp-bridge = "0.11.2"
tauri-plugin-process = "2.3.1"
# Запуск зовнішнього кодинг-агента `pi` (read/bash/edit/write) у cwd клієнта
# проксі-запиту — кнопки аналізу історії запитів (App.vue).
tauri-plugin-shell = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
