[package]
name = "myllm-proxy-service"
version = "0.1.0"
description = "Безінтерфейсний зворотний проксі omlx (форвардинг + компресія + історія + admin-стати + кореляція ланцюжків @7n/llm-lib) — витягнуто з myllm Tauri-застосунку, щоб працювати як persistent launchd-сервіс без GUI"
edition = "2021"
publish = false

[[bin]]
name = "myllm-proxy-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "stream", "rustls"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-stream = "0.1"
futures-util = "0.3"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
netstat2 = "0.11.2"

[dev-dependencies]
mockito = "1"
tempfile = "3"
